name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use the Android SDK already on the build machine
        run: echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install and copy the web app into Android
        run: |
          npm ci
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret yet, so this build is a TEST version signed with a temporary key."
          fi

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          mkdir -p ../dist
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon > ../gradle.log 2>&1 || { { sed -n '/What went wrong/,/Try:/p' ../gradle.log; grep -n -E 'e: |error:|ERROR' ../gradle.log; tail -5 ../gradle.log; } | head -40 | sed 's/^/::error::/'; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk ../dist/SalonLedger-1.0.${{ github.run_number }}.apk
          else
            ./gradlew assembleDebug --no-daemon > ../gradle.log 2>&1 || { { sed -n '/What went wrong/,/Try:/p' ../gradle.log; grep -n -E 'e: |error:|ERROR' ../gradle.log; tail -5 ../gradle.log; } | head -40 | sed 's/^/::error::/'; exit 1; }
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/SalonLedger-TEST-1.0.${{ github.run_number }}.apk
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: SalonLedger-apk
          path: dist/*.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KEYSTORE_FILE != '' && format('v1.0.{0}', github.run_number) || format('test-1.0.{0}', github.run_number) }}
          name: ${{ env.KEYSTORE_FILE != '' && format('Salon Ledger 1.0.{0}', github.run_number) || format('Salon Ledger TEST 1.0.{0} (temporary key)', github.run_number) }}
          prerelease: ${{ env.KEYSTORE_FILE == '' }}
          body: Download the .apk file below and open it on your Android phone or tablet to install or update.
          files: dist/*.apk
